<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Domain Expansion</title>
<style>body{margin:0;background:#000}</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<script>
function showErr(msg) {
  document.body.insertAdjacentHTML('beforeend',
    '<pre style="position:fixed;top:0;left:0;right:0;z-index:99;margin:0;color:#f55;background:#000;font-size:18px;white-space:pre-wrap;padding:10px">' + msg + '</pre>');
}
window.addEventListener('error', e => showErr((e.message || 'error') + ' @ line ' + e.lineno));
window.addEventListener('unhandledrejection', e => showErr('Promise error: ' + e.reason));
</script>

<script type="module">
import * as THREE from 'three';
import { VRButton } from 'three/addons/webxr/VRButton.js';
import { XRHandModelFactory } from 'three/addons/webxr/XRHandModelFactory.js';

// ---------- Setup ----------
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.01, 100);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);
document.body.appendChild(VRButton.createButton(renderer));

const sun = new THREE.DirectionalLight(0xffffff, 1);
sun.position.set(2, 5, 2);
scene.add(sun);
const ambient = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambient);

scene.fog = new THREE.FogExp2(0x87ceeb, 0.01);

// ---------- World objects ----------
const groundMat = new THREE.MeshStandardMaterial({ color: 0x3a7d44 });
const ground = new THREE.Mesh(new THREE.CircleGeometry(30, 48), groundMat);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// Trees (shrink away in some domains)
const trees = new THREE.Group();
const treeMat = new THREE.MeshStandardMaterial({ color: 0x2e6b3a });
for (let i = 0; i < 14; i++) {
  const a = (i / 14) * Math.PI * 2, r = 3 + Math.random() * 4;
  const tree = new THREE.Mesh(new THREE.ConeGeometry(0.5, 1.6, 8), treeMat);
  tree.position.set(Math.cos(a) * r, 0.8, Math.sin(a) * r);
  trees.add(tree);
}
scene.add(trees);

// Shrine (grows during Malevolent Shrine)
const shrine = new THREE.Group();
const shrineMat = new THREE.MeshStandardMaterial({ color: 0x2a0505, emissive: 0x330000 });
const roofMat = new THREE.MeshStandardMaterial({ color: 0x550a0a, emissive: 0x440000 });
function box(w, h, d, x, y, z, mat) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  shrine.add(m);
}
box(5, 0.3, 4, 0, 0.15, 0, shrineMat);      // base
box(0.35, 2.6, 0.35, -2, 1.6, 1.4, shrineMat); // pillars
box(0.35, 2.6, 0.35, 2, 1.6, 1.4, shrineMat);
box(0.35, 2.6, 0.35, -2, 1.6, -1.4, shrineMat);
box(0.35, 2.6, 0.35, 2, 1.6, -1.4, shrineMat);
box(5.8, 0.35, 4.8, 0, 3.1, 0, roofMat);    // roof
box(3.6, 0.35, 3, 0, 3.5, 0, roofMat);
box(1.6, 0.35, 1.4, 0, 3.85, 0, roofMat);
shrine.position.set(0, 0, -7);
shrine.scale.setScalar(0.001);
scene.add(shrine);

// Falling / rising particles
const N = 900;
const pos = new Float32Array(N * 3);
for (let i = 0; i < N; i++) {
  pos[i * 3] = (Math.random() - 0.5) * 16;
  pos[i * 3 + 1] = Math.random() * 8;
  pos[i * 3 + 2] = (Math.random() - 0.5) * 16;
}
const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
const pMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.04, transparent: true, opacity: 0 });
scene.add(new THREE.Points(geo, pMat));

// ---------- Domains ----------
const C = (h) => new THREE.Color(h);
const WORLDS = {
  normal: { sky: C(0x87ceeb), ground: C(0x3a7d44), tree: C(0x2e6b3a), p: C(0xffffff),
            size: 0.04, sun: 1.2,  amb: 0.7,  fall: 0,   op: 0,   fog: 0.01,  trees: 1, shrine: 0 },
  void:   { sky: C(0x000000), ground: C(0x04040a), tree: C(0x111111), p: C(0xffffff),
            size: 0.035, sun: 0.1, amb: 0.5,  fall: 0.15, op: 1,  fog: 0.0,   trees: 0, shrine: 0 },
  shrine: { sky: C(0x3a0000), ground: C(0x1a0505), tree: C(0x2a0a0a), p: C(0xff2222),
            size: 0.05, sun: 0.4,  amb: 0.35, fall: 14,  op: 0.9, fog: 0.03,  trees: 0, shrine: 1 },
  coffin: { sky: C(0xff5a1a), ground: C(0x7a1d05), tree: C(0x2a0a05), p: C(0xffaa33),
            size: 0.06, sun: 0.9,  amb: 0.5,  fall: -2.5, op: 1,  fog: 0.03,  trees: 0, shrine: 0 },
  shadow: { sky: C(0x05060d), ground: C(0x0b0b1a), tree: C(0x0a0a14), p: C(0x6b5bff),
            size: 0.05, sun: 0.1,  amb: 0.3,  fall: -0.5, op: 0.8, fog: 0.08, trees: 0.4, shrine: 0 },
};
let current = 'normal';
const skyCol = WORLDS.normal.sky.clone();
scene.background = skyCol;
let fallSpeed = 0;

// ---------- Hands ----------
const factory = new XRHandModelFactory();
const hands = [0, 1].map((i) => {
  const h = renderer.xr.getHand(i);
  h.add(factory.createHandModel(h, 'spheres'));
  scene.add(h);
  return h;
});

const FINGERS = ['index', 'middle', 'ring', 'pinky'];

function extended(hand, f) {
  const w = hand.joints['wrist'];
  const p = hand.joints[`${f}-finger-phalanx-proximal`];
  const t = hand.joints[`${f}-finger-tip`];
  if (!w || !p || !t) return null;
  return w.position.distanceTo(t.position) > w.position.distanceTo(p.position) * 1.5;
}

// Returns: fist, open, cross, peace, point or null
function pose(hand) {
  const e = FINGERS.map((f) => extended(hand, f));
  if (e.includes(null)) return null;
  const [i, m, r, p] = e;
  const n = e.filter(Boolean).length;
  if (n === 0) return 'fist';
  if (n === 4) return 'open';
  if (i && m && !r && !p) {
    const ti = hand.joints['index-finger-tip'];
    const tm = hand.joints['middle-finger-tip'];
    if (ti && tm && ti.position.distanceTo(tm.position) < 0.03) return 'cross'; // fingers crossed/touching
    return 'peace';
  }
  if (i && !m && !r && !p) return 'point';
  return null;
}

const SINGLE = { cross: 'void', fist: 'coffin', point: 'shadow', open: 'normal' };

// ---------- Loop ----------
const clock = new THREE.Clock();
const HOLD_MS = 300;
// slots: 0 = left hand, 1 = right hand, 2 = two-hand sign
const state = [0, 1, 2].map(() => ({ cand: null, since: 0, fired: false }));

function update(slot, sign, time) {
  const st = state[slot];
  if (sign !== st.cand) { st.cand = sign; st.since = time; st.fired = false; }
  else if (sign && !st.fired && time - st.since > HOLD_MS) {
    current = sign;
    st.fired = true;
  }
}

renderer.setAnimationLoop((time) => {
  const dt = Math.min(clock.getDelta(), 0.05);

  // Read poses
  const poses = hands.map((h) => (h.visible ? pose(h) : null));

  // One-hand domains
  update(0, SINGLE[poses[0]] || null, time);
  update(1, SINGLE[poses[1]] || null, time);

  // Two-hand domain: both hands peace sign and close together
  let two = null;
  if (poses[0] === 'peace' && poses[1] === 'peace') {
    const w0 = hands[0].joints['wrist'], w1 = hands[1].joints['wrist'];
    if (w0 && w1 && w0.position.distanceTo(w1.position) < 0.35) two = 'shrine';
  }
  update(2, two, time);

  // Blend toward current domain
  const W = WORLDS[current];
  const k = 1 - Math.exp(-dt * 2);
  skyCol.lerp(W.sky, k);
  scene.fog.color.copy(skyCol);
  scene.fog.density += (W.fog - scene.fog.density) * k;
  groundMat.color.lerp(W.ground, k);
  treeMat.color.lerp(W.tree, k);
  pMat.color.lerp(W.p, k);
  pMat.size += (W.size - pMat.size) * k;
  sun.intensity += (W.sun - sun.intensity) * k;
  ambient.intensity += (W.amb - ambient.intensity) * k;
  pMat.opacity += (W.op - pMat.opacity) * k;
  fallSpeed += (W.fall - fallSpeed) * k;

  const ts = trees.scale.x + (W.trees - trees.scale.x) * k;
  trees.scale.setScalar(Math.max(0.001, ts));
  const ss = shrine.scale.x + (W.shrine - shrine.scale.x) * k;
  shrine.scale.setScalar(Math.max(0.001, ss));
  shrine.visible = ss > 0.01;

  // Move particles (positive = fall, negative = rise)
  const a = geo.attributes.position;
  for (let i = 0; i < N; i++) {
    let y = a.getY(i) - fallSpeed * dt;
    if (y < 0) y += 8;
    if (y > 8) y -= 8;
    a.setY(i, y);
  }
  a.needsUpdate = true;

  renderer.render(scene, camera);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
